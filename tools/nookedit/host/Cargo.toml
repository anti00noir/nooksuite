[package]
name = "nooksuite-host"
version = "0.1.0"
description = "Native messaging host that gives NookBin the shared NookSuite library"
authors = ["NookSuite"]
edition = "2021"

[[bin]]
name = "nooksuite-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dirs = "6"
nooksuite-library = { path = "../../../crates/nooksuite-library" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
