[package]
name = "nookedit"
version = "0.1.0"
description = "NookEdit native app — P0 spike harness"
authors = ["NookSuite"]
edition = "2021"

[lib]
name = "nookedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
